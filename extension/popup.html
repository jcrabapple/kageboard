<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save to Kageboard</title>
  <style>
    :root {
      --bg: #fff;
      --text: #1a1a2e;
      --text-muted: #6b7280;
      --accent: #2d6df6;
      --accent-hover: #1a56db;
      --accent-subtle: #eef2ff;
      --border: #e5e7eb;
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --success: #10b981;
      --error: #ef4444;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: var(--font);
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
    }
    .container { padding: 16px; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .logo {
      font-size: 1.1rem;
      font-weight: 650;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo-icon { font-size: 1.3rem; }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .settings-link, .logout-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 1.1rem;
      padding: 4px;
      border-radius: var(--radius);
      transition: background 0.1s;
      cursor: pointer;
    }
    .settings-link:hover, .logout-link:hover { background: var(--accent-subtle); }
    .logout-link { font-size: 0.85rem; }

    .current-page {
      background: var(--accent-subtle);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .page-url {
      font-size: 0.8rem;
      color: var(--text-muted);
      word-break: break-all;
      line-height: 1.4;
      max-height: 2.8em;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .page-title {
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Auth form */
    .auth-section {
      margin-bottom: 12px;
    }
    .auth-section .form-group {
      margin-bottom: 8px;
    }
    .auth-section label {
      display: block;
      font-size: 0.75rem;
      font-weight: 550;
      color: var(--text-muted);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .auth-section input {
      width: 100%;
      padding: 7px 10px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: var(--font);
    }
    .auth-section input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-subtle);
    }
    .auth-error {
      color: var(--error);
      font-size: 0.78rem;
      margin-bottom: 6px;
      display: none;
    }

    .options { margin-bottom: 12px; }
    .option-row {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
      align-items: center;
    }
    .option-row label {
      font-size: 0.78rem;
      color: var(--text-muted);
      min-width: 65px;
    }
    .option-row input[type="number"] {
      width: 70px;
      padding: 4px 8px;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--font);
    }
    .toggle-row {
      display: flex;
      gap: 12px;
      margin-bottom: 8px;
    }
    .toggle-row label {
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 9px 0;
      font-size: 0.85rem;
      font-weight: 550;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-family: var(--font);
      transition: background 0.12s;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; pointer-events: none; }
    .btn-secondary {
      background: var(--accent-subtle);
      color: var(--accent);
      margin-top: 8px;
    }
    .btn-secondary:hover { background: #dde4ff; }

    .status {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: var(--radius);
      font-size: 0.8rem;
      display: none;
    }
    .status.show { display: block; }
    .status.success { background: #ecfdf5; color: #065f46; }
    .status.error { background: #fef2f2; color: #991b1b; }
    .status.info { background: var(--accent-subtle); color: var(--accent); }
    .status .link {
      display: inline-block;
      margin-top: 4px;
      color: var(--accent);
      font-weight: 550;
      cursor: pointer;
      text-decoration: underline;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .recent {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .recent h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .recent-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 0.82rem;
    }
    .recent-item .host { font-weight: 500; }
    .recent-item .count { color: var(--text-muted); font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo"><span class="logo-icon">影</span> Kageboard</div>
      <div class="header-right">
        <a href="#" class="logout-link" id="logout-link" style="display:none" title="Sign out">Sign out</a>
        <a href="#" class="settings-link" id="open-options" title="Settings">⚙</a>
      </div>
    </div>

    <div class="current-page">
      <div class="page-title" id="page-title">Loading…</div>
      <div class="page-url" id="page-url"></div>
    </div>

    <!-- Auth section (shown when not authenticated) -->
    <div class="auth-section" id="auth-section" style="display:none">
      <div class="form-group">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" placeholder="kageboard" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
      </div>
      <div class="auth-error" id="login-error"></div>
      <button class="btn btn-primary" id="login-btn">Sign In</button>
    </div>

    <!-- Action section (shown when authenticated) -->
    <div id="action-section" style="display:none">
      <div class="options">
        <div class="toggle-row">
          <label><input type="checkbox" id="opt-whole-site"> Whole site</label>
          <label><input type="checkbox" id="opt-scroll"> Auto-scroll</label>
        </div>
        <div class="option-row" id="advanced-options" style="display:none">
          <label>Max pages</label>
          <input type="number" id="opt-max-pages" placeholder="all" min="1">
          <label>Depth</label>
          <input type="number" id="opt-max-depth" placeholder="all" min="1">
        </div>
      </div>

      <button class="btn btn-primary" id="clone-btn">
        <span id="btn-text">Save Page to Kageboard</span>
        <span class="spinner" id="btn-spinner" style="display:none"></span>
      </button>

      <button class="btn btn-secondary" id="clone-site-btn" style="display:none">
        Clone Entire Site
      </button>

      <div class="status" id="status"></div>

      <div class="recent">
        <h3>Recent Mirrors</h3>
        <div id="recent-list">Loading…</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>

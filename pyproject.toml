[project]
name = "kageboard"
version = "0.1.1"
description = "Web dashboard for Kage — manage, clone, browse, and pack offline website mirrors"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jason Crabtree"}]
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-flask>=1.3",
]

[project.scripts]
kageboard = "kageboard.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kageboard*"]